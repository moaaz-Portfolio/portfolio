<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOAAZ OS v4.0 | Enterprise Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ffffff; --bg: #020202; }
        body { background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.05); transition: 0.4s cubic-bezier(0.2, 1, 0.3, 1); }
        .glass-card:hover { border-color: rgba(255,255,255,0.2); box-shadow: 0 0 40px rgba(255,255,255,0.05); }
        .input-lux { background: #080808; border: 1px solid #151515; border-radius: 12px; padding: 12px; width: 100%; color: #fff; outline: none; }
        .input-lux:focus { border-color: #fff; }
        .hidden-project { opacity: 0.4; filter: grayscale(1); }
        .btn-action { padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.05); transition: 0.3s; }
        .btn-action:hover { background: rgba(255,255,255,0.2); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="p-4 lg:p-10">

    <div class="max-w-[1700px] mx-auto grid grid-cols-12 gap-8">
        
        <aside class="col-span-12 lg:col-span-3 space-y-6">
            <div class="glass-card p-8 rounded-[35px] sticky top-10">
                <div class="flex justify-between items-center mb-10">
                    <h1 class="text-2xl font-black italic tracking-tighter">MOAAZ.OS</h1>
                    <span class="text-[9px] bg-white text-black px-2 py-1 rounded font-bold">V4.0</span>
                </div>

                <form id="projectForm" class="space-y-4">
                    <input type="text" id="pName" class="input-lux" placeholder="Project Name" required>
                    <input type="text" id="pCategory" class="input-lux" placeholder="Category" required>
                    <input type="text" id="pUrl" class="input-lux" placeholder="Image Name (e.g. watch.png)" required>
                    <select id="pStatus" class="input-lux">
                        <option value="Visible">Public (Live)</option>
                        <option value="Hidden">Hidden (Draft)</option>
                    </select>
                    <button type="submit" class="w-full bg-white text-black py-4 rounded-xl font-black text-xs uppercase tracking-widest hover:scale-[1.02] transition">Deploy Now</button>
                </form>

                <div class="mt-10 pt-6 border-t border-white/5 space-y-3">
                    <button onclick="exportData()" class="w-full text-[10px] text-gray-500 hover:text-white transition flex items-center justify-between uppercase font-bold tracking-widest">
                        <span>Backup Database</span>
                        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 10.5L10.5 7.5H4.5L7.5 10.5Z" fill="currentColor"></path></svg>
                    </button>
                </div>
            </div>
        </aside>

        <main class="col-span-12 lg:col-span-9 space-y-8">
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-4xl font-black tracking-tighter uppercase">Infrastructure</h2>
                    <p class="text-gray-500 text-xs mt-2 uppercase tracking-[0.3em]">System Health: <span class="text-green-500">Nominal</span></p>
                </div>
                <div class="glass-card px-6 py-4 rounded-2xl flex items-baseline gap-2">
                    <span id="totalCount" class="text-3xl font-black">0</span>
                    <span class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Records</span>
                </div>
            </div>

            <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsYNycH16UHTOKcQPXHEsq-glJslhdAJA",
            authDomain: "desinger-584a4.firebaseapp.com",
            projectId: "desinger-584a4",
            storageBucket: "desinger-584a4.firebasestorage.app",
            messagingSenderId: "669703794280",
            appId: "1:669703794280:web:eeef5b8a181d8a44de55dd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allProjects = [];

        // LOAD & RENDER
        onSnapshot(query(collection(db, "projects"), orderBy("createdAt", "desc")), (snap) => {
            allProjects = snap.docs.map(d => ({id: d.id, ...d.data()}));
            document.getElementById('totalCount').innerText = allProjects.length;
            render();
        });

        function render() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = "";
            allProjects.forEach(p => {
                const isHidden = p.status === 'Hidden';
                const card = document.createElement('div');
                card.className = `glass-card p-6 rounded-[30px] relative group ${isHidden ? 'hidden-project' : ''}`;
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex gap-2">
                            <button onclick="toggleVisibility('${p.id}', '${p.status}')" class="btn-action text-gray-400 hover:text-white" title="Toggle Visibility">
                                ${isHidden ? '👁️' : '🕶️'}
                            </button>
                            <a href="${p.imageUrl}" target="_blank" class="btn-action text-gray-400 hover:text-white" title="Open Image">🔗</a>
                        </div>
                        <button onclick="deleteProject('${p.id}')" class="btn-action text-red-900 hover:text-red-500 transition">✕</button>
                    </div>
                    <h3 class="font-extrabold text-lg truncate">${p.title}</h3>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-4">${p.category}</p>
                    <div class="aspect-video bg-black/40 rounded-2xl overflow-hidden border border-white/5">
                        <img src="${p.imageUrl}" class="w-full h-full object-cover">
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ACTIONS
        window.toggleVisibility = async (id, currentStatus) => {
            const newStatus = currentStatus === 'Hidden' ? 'Visible' : 'Hidden';
            await updateDoc(doc(db, "projects", id), { status: newStatus });
        };

        window.deleteProject = async (id) => {
            if(confirm("Permanent Delete?")) await deleteDoc(doc(db, "projects", id));
        };

        window.exportData = () => {
            const blob = new Blob([JSON.stringify(allProjects, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Moaaz_Backup_${new Date().toLocaleDateString()}.json`;
            a.click();
        };

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "projects"), {
                title: document.getElementById('pName').value,
                category: document.getElementById('pCategory').value,
                imageUrl: document.getElementById('pUrl').value,
                status: document.getElementById('pStatus').value,
                createdAt: serverTimestamp()
            });
            e.target.reset();
        });
    </script>
</body>
</html>
