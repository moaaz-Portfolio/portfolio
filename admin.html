<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moaaz | Mega Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #020202; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(15, 15, 15, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .input-field { background: #0c0c0c; border: 1px solid #1a1a1a; border-radius: 12px; padding: 14px; width: 100%; color: #fff; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #ffffff; box-shadow: 0 0 15px rgba(255,255,255,0.05); }
        .btn-primary { background: #fff; color: #000; font-weight: 800; border-radius: 12px; transition: 0.4s cubic-bezier(0.2, 1, 0.3, 1); }
        .btn-primary:hover { transform: scale(1.02); filter: drop-shadow(0 0 10px rgba(255,255,255,0.4)); }
        .project-card { transition: 0.3s; border: 1px solid rgba(255,255,255,0.03); }
        .project-card:hover { border-color: rgba(255,255,255,0.2); background: rgba(20,20,20,1); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_right,_#111_0%,_#020202_50%)]">

    <div class="flex flex-col lg:flex-row min-h-screen">
        
        <aside class="lg:w-[400px] p-8 glass h-screen lg:sticky top-0 overflow-y-auto">
            <div class="mb-10">
                <h1 class="text-3xl font-black tracking-tighter uppercase leading-none">Moaaz<br><span class="text-gray-500 text-sm tracking-[0.4em] font-light italic">Designer OS</span></h1>
            </div>

            <section>
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-6 flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> New Publication
                </h2>
                
                <form id="projectForm" class="space-y-5">
                    <div>
                        <label class="text-[10px] uppercase text-gray-500 ml-1">Project Name</label>
                        <input type="text" id="pName" class="input-field mt-1" placeholder="Barns Coffee" required>
                    </div>

                    <div>
                        <label class="text-[10px] uppercase text-gray-500 ml-1">Category</label>
                        <input type="text" id="pCategory" class="input-field mt-1" placeholder="Social Media" required>
                    </div>

                    <div>
                        <label class="text-[10px] uppercase text-gray-500 ml-1">Image Asset Name</label>
                        <input type="text" id="pUrl" class="input-field mt-1" placeholder="filename.png" required>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-primary w-full py-4 mt-4 uppercase text-xs tracking-widest">
                        Publish To Cloud
                    </button>
                </form>
                <p id="status" class="mt-4 text-center text-[10px] uppercase font-bold tracking-tighter"></p>
            </section>
        </aside>

        <main class="flex-1 p-8 lg:p-16">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-16">
                <div class="glass p-8 rounded-[30px]">
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-2">Total Works</p>
                    <h3 id="totalCount" class="text-5xl font-black">0</h3>
                </div>
                <div class="glass p-8 rounded-[30px] border-l-4 border-l-white">
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-2">System Status</p>
                    <h3 class="text-xl font-black uppercase text-green-400">Online</h3>
                </div>
                <div class="glass p-8 rounded-[30px]">
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-2">Last Update</p>
                    <h3 id="lastUpdate" class="text-sm font-bold text-gray-300">Today</h3>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-10">
                    <h2 class="text-4xl font-black tracking-tighter uppercase">Live Portfolio</h2>
                    <span class="text-[10px] bg-white/10 px-4 py-2 rounded-full font-bold uppercase tracking-widest">Sync Active</span>
                </div>

                <div id="projectsList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsYNycH16UHTOKcQPXHEsq-glJslhdAJA",
            authDomain: "desinger-584a4.firebaseapp.com",
            projectId: "desinger-584a4",
            storageBucket: "desinger-584a4.firebasestorage.app",
            messagingSenderId: "669703794280",
            appId: "1:669703794280:web:eeef5b8a181d8a44de55dd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('projectForm');
        const status = document.getElementById('status');
        const projectsList = document.getElementById('projectsList');
        const totalCount = document.getElementById('totalCount');

        // ADD PROJECT
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            status.innerText = "Processing Data...";
            
            try {
                await addDoc(collection(db, "projects"), {
                    title: document.getElementById('pName').value,
                    category: document.getElementById('pCategory').value,
                    imageUrl: document.getElementById('pUrl').value,
                    createdAt: serverTimestamp()
                });
                status.style.color = "#4ade80";
                status.innerText = "Project Synced Successfully";
                form.reset();
            } catch (error) {
                status.style.color = "#f87171";
                status.innerText = "Sync Error: " + error.message;
            }
        });

        // LIVE LISTEN FOR CHANGES (Displaying Projects)
        const q = query(collection(db, "projects"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            projectsList.innerHTML = "";
            totalCount.innerText = snapshot.size;
            
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const card = document.createElement('div');
                card.className = "project-card glass p-4 rounded-2xl flex items-center gap-4 group relative overflow-hidden";
                card.innerHTML = `
                    <div class="w-16 h-16 rounded-xl bg-neutral-900 overflow-hidden">
                        <img src="${data.imageUrl}" class="w-full h-full object-cover opacity-50">
                    </div>
                    <div class="flex-1">
                        <h4 class="font-bold text-sm tracking-tight">${data.title}</h4>
                        <p class="text-[10px] text-gray-500 uppercase">${data.category}</p>
                    </div>
                    <button onclick="deleteProject('${docSnap.id}')" class="text-red-500 opacity-0 group-hover:opacity-100 p-2 hover:bg-red-500/10 rounded-lg transition-all">
                        <svg width="18" height="18" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.5 1C5.22386 1 5 1.22386 5 1.5C5 1.77614 5.22386 2 5.5 2H9.5C9.77614 2 10 1.77614 10 1.5C10 1.22386 9.77614 1 9.5 1H5.5ZM3 3.5C3 3.22386 3.22386 3 3.5 3H11.5C11.7761 3 12 3.22386 12 3.5C12 3.77614 11.7761 4 11.5 4H3.5C3.22386 4 3 3.77614 3 3.5ZM4.5 5C4.22386 5 4 5.22386 4 5.5V12C4 12.5523 4.44772 13 5 13H10C10.5523 13 11 12.5523 11 12V5.5C11 5.22386 10.7761 5 10.5 5H4.5Z" fill="currentColor"></path></svg>
                    </button>
                `;
                projectsList.appendChild(card);
            });
        });

        // DELETE PROJECT FUNCTION
        window.deleteProject = async (id) => {
            if(confirm("Are you sure you want to delete this project?")) {
                await deleteDoc(doc(db, "projects", id));
            }
        }
    </script>
</body>
</html>
