<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Works | Moaaz Professional Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; width: 100%; margin: 0; }
        .floating-nav { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); border-radius: 100px; z-index: 1000; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .project-card { position: relative; width: 100%; aspect-ratio: 1/1; background: #0f0f0f; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); opacity: 0; transform: translateY(30px); }
        .project-img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s cubic-bezier(0.2, 1, 0.3, 1); }
        .project-card:hover .project-img { transform: scale(1.05); }
        .project-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%); display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; }
        .category { font-size: 10px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 5px; }
        .p-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
        .back-btn { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; }
        
        /* تأثيرات الاستايل الفخم المستوحى من Behance Pro */
        .behance-backdrop { background: rgba(3, 3, 3, 0.6); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
        .behance-panel { background: #0b0b0b; border-left: 1px solid rgba(255,255,255,0.06); box-shadow: -20px 0 50px rgba(0,0,0,0.8); }
        .action-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s cubic-bezier(0.2, 1, 0.3, 1); }
        .action-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .action-btn.liked { background: #ff2a54; border-color: #ff2a54; color: white; animation: pop 0.3s ease-in-out; }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* مخصص لتجميل شريط التمرير داخل لوحة المعاينة */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <header class="floating-nav">
        <a href="index.html" class="back-btn flex items-center gap-2">
            <svg width="12" height="12" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.85355 3.14645C7.04882 3.34171 7.04882 3.65829 6.85355 3.85355L3.70711 7H12.5C12.7761 7 13 7.22386 13 7.5C13 7.77614 12.7761 8 12.5 8H3.70711L6.85355 11.1464C7.04882 11.3417 7.04882 11.6583 6.85355 11.8536C6.65829 12.0488 6.34171 12.0488 6.14645 11.8536L2.14645 7.85355C1.95118 7.65829 1.95118 7.34171 2.14645 7.14645L6.14645 3.14645C6.34171 2.95118 6.65829 2.95118 6.85355 3.14645Z" fill="currentColor"></path></svg>
            Back
        </a>
        <div class="text-[9px] font-black tracking-widest uppercase">Works</div>
    </header>

    <main class="pt-32 px-6 pb-20">
        <h1 class="text-5xl font-black tracking-tighter uppercase mb-2">Selected</h1>
        <h1 class="text-5xl font-black tracking-tighter uppercase opacity-20 mb-12">Projects.</h1>

        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </main>

    <!-- بوابة العرض الجانبية الاحترافية المستوحاة من Behance -->
    <div id="behance-modal" class="fixed inset-0 z-[2000] behance-backdrop opacity-0 pointer-events-none transition-opacity duration-400 flex justify-end">
        
        <!-- اللوحة المنبثقة الجانبية -->
        <div id="modal-panel" class="behance-panel w-full max-w-5xl h-full flex flex-col md:flex-row transform translate-x-full">
            
            <!-- القسم الأيسر: منطقة عرض الصورة المستمرة الكبيرة جداً مع حماية تامة وأزرار عائمة -->
            <div class="relative flex-grow h-[50vh] md:h-full bg-black/40 flex items-center justify-center p-4 group overflow-hidden">
                <img id="view-img" src="" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl select-none" alt="Case Study Screen">
                
                <!-- زر إغلاق طائر مذهل -->
                <button id="close-modal" class="absolute top-6 left-6 text-white/50 hover:text-white transition-all p-3 bg-black/40 hover:bg-black/80 rounded-full border border-white/10 backdrop-blur-md">
                    <svg width="18" height="18" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.7816 4.03157C12.0062 3.80696 12.0062 3.44288 11.7816 3.21827C11.557 2.99367 11.1929 2.99367 10.9683 3.21827L7.5 6.68657L4.03173 3.21827C3.80712 2.99367 3.44304 2.99367 3.21843 3.21827C2.99383 3.44288 2.99383 3.80696 3.21843 4.03157L6.6867 7.5L3.21843 10.9684C2.99383 11.193 2.99383 11.5571 3.21843 11.7817C3.44304 12.0063 3.80712 12.0063 4.03173 11.7817L7.5 8.31343L10.9683 11.7817C11.1929 12.0063 11.557 12.0063 11.7816 11.7817C12.0062 11.5571 12.0062 11.193 11.7816 10.9684L8.3133 7.5L11.7816 4.03157Z" fill="currentColor"></path></svg>
                </button>
            </div>

            <!-- القسم الأيمن: شريط البيانات التفاعلي الغني ومساحة الـ Analytics والمشاركة -->
            <div class="w-full md:w-[380px] h-[50vh] md:h-full bg-[#0a0a0a] p-8 flex flex-col justify-between border-t md:border-t-0 md:border-l border-white/5 custom-scroll overflow-y-auto">
                
                <div class="flex flex-col gap-8">
                    <!-- رأس البيانات -->
                    <div class="anim-target">
                        <span id="view-cat" class="category text-xs tracking-widest text-white/40 block mb-2">CREATIVE DIRECTION</span>
                        <h2 id="view-title" class="text-2xl font-black tracking-tight text-white leading-tight">Project Masterpiece</h2>
                    </div>

                    <!-- شريط إحصائيات وهمي لكنه يضيف ثقة خيالية للموقع كأنك على بيهانس -->
                    <div class="flex items-center gap-6 py-4 border-y border-white/5 anim-target">
                        <div class="flex items-center gap-2 text-white/50 text-xs">
                            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            <span id="stat-views">1,240</span> Views
                        </div>
                        <div class="flex items-center gap-2 text-white/50 text-xs">
                            <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <span id="stat-likes">312</span> Likes
                        </div>
                    </div>

                    <!-- مواصفات العمل الفنية (الأدوات والألوان المستهدفة لعملائك) -->
                    <div class="flex flex-col gap-4 anim-target">
                        <h4 class="text-[10px] font-black tracking-widest text-white/30 uppercase">Project Details</h4>
                        <p class="text-sm text-white/70 leading-relaxed font-normal">Premium visual layout meticulously tailored for modern user engagement with sleek alignment and minimalist aesthetic.</p>
                        
                        <div class="flex flex-wrap gap-2 mt-2">
                            <span class="text-[11px] px-3 py-1 rounded-full bg-white/5 text-white/60 border border-white/5">Canva Expert</span>
                            <span class="text-[11px] px-3 py-1 rounded-full bg-white/5 text-white/60 border border-white/5">UI/UX Mindset</span>
                            <span class="text-[11px] px-3 py-1 rounded-full bg-white/5 text-white/60 border border-white/5">Luxury Minimal</span>
                        </div>
                    </div>
                </div>

                <!-- شريط الأدوات الرئيسي بالأسفل (المميزات التفاعلية الاحترافية) -->
                <div class="flex flex-col gap-3 mt-12 anim-target">
                    <div class="grid grid-cols-3 gap-2">
                        <!-- زر الـ Like التفاعلي مع أنيميشن -->
                        <button id="like-btn" class="action-btn flex flex-col items-center justify-center py-3 rounded-xl gap-1 text-white/60">
                            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <span class="text-[9px] font-bold uppercase">Like</span>
                        </button>
                        
                        <!-- زر نسخ الرابط الذكي للفولدر أو العميل -->
                        <button id="share-btn" class="action-btn flex flex-col items-center justify-center py-3 rounded-xl gap-1 text-white/60">
                            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 10.742l4.228-2.114M8.684 13.258l4.228 2.114M7.4 12a1.4 1.4 0 11-2.8 0 1.4 1.4 0 012.8 0zm7.8-4.4a1.4 1.4 0 11-2.8 0 1.4 1.4 0 012.8 0zm0 8.8a1.4 1.4 0 11-2.8 0 1.4 1.4 0 012.8 0z"/></svg>
                            <span id="share-text" class="text-[9px] font-bold uppercase">Share</span>
                        </button>

                        <!-- زر تحميل الصورة بدقة أصلية حقيقية -->
                        <a id="download-btn" href="" download target="_blank" class="action-btn flex flex-col items-center justify-center py-3 rounded-xl gap-1 text-white/60 text-center">
                            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            <span class="text-[9px] font-bold uppercase">Save</span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="module">
       import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDsYNycH16UHTOKcQPXHEsq-glJslhdAJA",
    authDomain: "desinger-584a4.firebaseapp.com",
    projectId: "desinger-584a4",
    storageBucket: "desinger-584a4.firebasestorage.app",
    messagingSenderId: "669703794280",
    appId: "1:669703794280:web:eeef5b8a181d8a44de55dd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ربط عناصر الـ DOM
const modal = document.getElementById('behance-modal');
const panel = document.getElementById('modal-panel');
const viewImg = document.getElementById('view-img');
const viewTitle = document.getElementById('view-title');
const viewCat = document.getElementById('view-cat');
const closeBtn = document.getElementById('close-modal');
const likeBtn = document.getElementById('like-btn');
const shareBtn = document.getElementById('share-btn');
const shareText = document.getElementById('share-text');
const downloadBtn = document.getElementById('download-btn');
const statViews = document.getElementById('stat-views');
const statLikes = document.getElementById('stat-likes');

let currentActiveProjectId = null; 

async function loadProjects() {
    const grid = document.getElementById('projects-grid');
    
    const q = query(
        collection(db, "projects"),
        where("status", "==", "Visible"),
        orderBy("createdAt", "desc")
    );
    
    try {
        const querySnapshot = await getDocs(q);
        grid.innerHTML = "";

        querySnapshot.forEach((docSnap) => {
            const project = docSnap.data();
            const projectId = docSnap.id; 
            
            const views = project.views || 0;
            const likes = project.likes || 0;

            const card = `
                <div class="project-card reveal block cursor-pointer" 
                     data-id="${projectId}"
                     data-img="${project.imageUrl}" 
                     data-title="${project.title}" 
                     data-category="${project.category}"
                     data-views="${views}"
                     data-likes="${likes}">
                    <img src="${project.imageUrl}" class="project-img" alt="${project.title}">
                    <div class="project-overlay">
                        <span class="category">${project.category}</span>
                        <h3 class="p-title">${project.title}</h3>
                    </div>
                </div>
            `;
            grid.innerHTML += card;
        });

        gsap.to(".reveal", { opacity: 1, y: 0, duration: 1.2, stagger: 0.15, ease: "power4.out" });

        document.querySelectorAll('.project-card').forEach(card => {
            card.addEventListener('click', () => {
                openBehanceModal(
                    card.getAttribute('data-id'),
                    card.getAttribute('data-img'),
                    card.getAttribute('data-title'),
                    card.getAttribute('data-category'),
                    parseInt(card.getAttribute('data-views')),
                    parseInt(card.getAttribute('data-likes'))
                );
            });
        });

    } catch (error) {
        console.error("Firebase Connection Error: ", error);
    }
}

// دالة الفتح الذكية - تمنع تكرار المشاهدات
async function openBehanceModal(id, img, title, category, views, likes) {
    currentActiveProjectId = id; 
    
    viewImg.src = img;
    viewTitle.innerText = title;
    viewCat.innerText = category;
    downloadBtn.href = img;
    
    // 🛡️ فحص هل شاهد المستخدم هذا المشروع في الجلسة الحالية؟
    const hasViewed = sessionStorage.getItem(`viewed_${id}`);
    let finalViews = views;

    if (!hasViewed) {
        finalViews = views + 1; // زيادة المشاهدة محلياً فوراً للعرض
        sessionStorage.setItem(`viewed_${id}`, 'true'); // تعليم المشروع كـ "تمت مشاهدته"
    }

    statViews.innerText = finalViews.toLocaleString();
    statLikes.innerText = likes.toLocaleString();
    
    // 🛡️ فحص حالة الـ Like السابقة لتلوين الزر تلقائياً إذا كان قد ضغط عليه سابقاً
    const hasLiked = localStorage.getItem(`liked_${id}`);
    if (hasLiked) {
        likeBtn.classList.add('liked');
    } else {
        likeBtn.classList.remove('liked');
    }
    
    shareText.innerText = "Share";
    modal.classList.remove('pointer-events-none');
    
    const tl = gsap.timeline();
    tl.to(modal, { opacity: 1, duration: 0.3, ease: "power2.out" })
      .to(panel, { x: "0%", duration: 0.7, ease: "power4.out" }, "-=0.2")
      .fromTo(".anim-target", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.08, ease: "power3.out" }, "-=0.4");
    
    lenis.stop();

    // 🚀 أرسل الزيادة للـ Firebase فقط إذا كانت مشاهدة جديدة فعلاً!
    if (!hasViewed) {
        try {
            const projectRef = doc(db, "projects", id);
            await updateDoc(projectRef, { views: increment(1) });
            
            // تحديث كارت المشروع الأصلي في الصفحة
            const originCard = document.querySelector(`[data-id="${id}"]`);
            if(originCard) originCard.setAttribute('data-views', finalViews);
        } catch(err) {
            console.error("Error updating views: ", err);
        }
    }
}

// دالة الإغلاق
function closeBehanceModal() {
    const tl = gsap.timeline({
        onComplete: () => {
            modal.classList.add('pointer-events-none');
            viewImg.src = "";
            lenis.start();
        }
    });
    tl.to(panel, { x: "100%", duration: 0.5, ease: "power3.in" })
      .to(modal, { opacity: 0, duration: 0.3, ease: "power2.in" }, "-=0.2");
}

// 🚀 منطق الـ Like المحمي تماماً من التكرار والسبام
likeBtn.addEventListener('click', async () => {
    if (!currentActiveProjectId) return;
    
    const projectRef = doc(db, "projects", currentActiveProjectId);
    const originCard = document.querySelector(`[data-id="${currentActiveProjectId}"]`);
    
    // فحص هل معجب به حالياً في المتصفح؟
    const hasLiked = localStorage.getItem(`liked_${currentActiveProjectId}`);
    let currentLikes = parseInt(statLikes.innerText.replace(/,/g, ''));
    
    if(!hasLiked) {
        // حالة: لايك جديد حقيقي
        likeBtn.classList.add('liked');
        statLikes.innerText = (currentLikes + 1).toLocaleString();
        if(originCard) originCard.setAttribute('data-likes', currentLikes + 1);
        
        localStorage.setItem(`liked_${currentActiveProjectId}`, 'true'); // حفظ الحالة بشكل دائم
        await updateDoc(projectRef, { likes: increment(1) });
    } else {
        // حالة: إلغاء اللايك السابق (مسموح به مرة واحدة فقط)
        likeBtn.classList.remove('liked');
        const nextLikes = Math.max(0, currentLikes - 1);
        statLikes.innerText = nextLikes.toLocaleString();
        if(originCard) originCard.setAttribute('data-likes', nextLikes);
        
        localStorage.removeItem(`liked_${currentActiveProjectId}`); // مسح الحالة من المتصفح
        await updateDoc(projectRef, { likes: increment(-1) });
    }
});

// نسخ الرابط
shareBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(viewImg.src).then(() => {
        shareText.innerText = "Copied!";
        gsap.fromTo("#share-text", { scale: 0.8 }, { scale: 1, duration: 0.3, ease: "back.out" });
        setTimeout(() => { shareText.innerText = "Share"; }, 2000);
    });
});

closeBtn.addEventListener('click', closeBehanceModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeBehanceModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBehanceModal(); });

// Smooth Scroll
const lenis = new Lenis();
function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

loadProjects();
    </script>
</body>
</html>
