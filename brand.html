<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Case Study</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">

<style>
body{
    background:#050505;
    color:#fff;
    font-family:'Plus Jakarta Sans',sans-serif;
}

/* HERO */
.hero{
    height:70vh;
    position:relative;
    overflow:hidden;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scale(1.1);
}

/* overlay */
.hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top, black, transparent);
    display:flex;
    align-items:flex-end;
    padding:40px;
}

/* gallery */
.item{
    opacity:0;
    transform:translateY(40px);
}

.item img{
    width:100%;
    border-radius:20px;
    transition:0.6s;
}

.item img:hover{
    transform:scale(1.03);
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero" id="hero">
    <img id="cover">
    <div class="hero-overlay">
        <div>
            <h1 id="title" class="text-5xl font-black"></h1>
            <p id="desc" class="text-gray-400 mt-2"></p>
        </div>
    </div>
</div>

<!-- CONTENT -->
<div class="max-w-5xl mx-auto p-6 mt-10">

<div id="gallery" class="space-y-12"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
    apiKey:"AIzaSyDsYNycH16UHTOKcQPXHEsq-glJslhdAJA",
    authDomain:"desinger-584a4.firebaseapp.com",
    projectId:"desinger-584a4"
});

const db = getFirestore(app);

// get id
const params = new URLSearchParams(location.search);
const id = params.get("id");

async function load(){

    const ref = doc(db,"brandings",id);
    const snap = await getDoc(ref);

    if(!snap.exists()){
        document.body.innerHTML = "Not Found";
        return;
    }

    const b = snap.data();

    // hero
    cover.src = b.imageUrl;
    title.innerText = b.title || "";
    desc.innerText = b.description || "";

    const gallery = document.getElementById("gallery");

    // لو فيه صور متعددة
    if(b.images){

        b.images.forEach((img, index)=>{

            const caption = b.captions ? b.captions[index] : "";

            gallery.innerHTML += `
            <div class="item">
                <img src="${img}">
                <h3 class="text-xl mt-4 font-bold">${caption || ""}</h3>
            </div>
            `;
        });

    } else {

        gallery.innerHTML += `
        <div class="item">
            <img src="${b.imageUrl}">
        </div>
        `;
    }

    // animation
    gsap.to(".item",{
        opacity:1,
        y:0,
        duration:1,
        stagger:0.2,
        ease:"power4.out"
    });
}

load();


// smooth scroll
const lenis = new Lenis();
function raf(time){
    lenis.raf(time);
    requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

</script>

</body>
</html>
