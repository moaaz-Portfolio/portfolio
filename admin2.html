<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branding Admin | Moaaz</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

<style>
body { background:#000; color:#fff; font-family:'Plus Jakarta Sans',sans-serif; }
.glass { background:rgba(255,255,255,0.02); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.05); }
.input { background:#080808; border:1px solid #1a1a1a; border-radius:12px; padding:12px; width:100%; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth" class="fixed inset-0 flex items-center justify-center bg-black z-50">
    <div class="glass p-10 rounded-3xl w-full max-w-sm text-center">
        <h2 class="font-black uppercase mb-6">Branding Access</h2>
        <input type="password" id="pass" class="input mb-4 text-center">
        <button onclick="login()" class="bg-white text-black w-full py-3 rounded-xl font-bold">Enter</button>
        <p id="err" class="text-red-500 text-xs mt-3 hidden">Wrong Password</p>
    </div>
</div>

<!-- MAIN -->
<div id="app" class="hidden p-6 lg:p-12">

<div class="max-w-7xl mx-auto">

<header class="flex justify-between mb-10">
    <h1 class="text-3xl font-black">Branding.Admin</h1>
</header>

<div class="grid grid-cols-12 gap-8">

<!-- FORM -->
<div class="col-span-12 lg:col-span-4">
<form id="form" class="glass p-6 rounded-3xl space-y-4">

<input id="title" class="input" placeholder="Brand Name" required>
<input id="category" class="input" placeholder="Type (Logo / Identity)" required>

<input type="file" id="image" class="input" required>

<select id="status" class="input">
<option value="Visible">Visible</option>
<option value="Hidden">Hidden</option>
</select>

<button class="bg-white text-black w-full py-4 rounded-xl font-bold">Upload</button>
<p id="msg" class="text-xs text-center"></p>

</form>
</div>

<!-- GRID -->
<div class="col-span-12 lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-6" id="grid"></div>

</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
    apiKey:"AIzaSyDsYNycH16UHTOKcQPXHEsq-glJslhdAJA",
    authDomain:"desinger-584a4.firebaseapp.com",
    projectId:"desinger-584a4"
});

const db = getFirestore(app);
const IMGBB = "f1f849d83dda1149d7758df485628800";

// ELEMENTS
const title = document.getElementById("title");
const category = document.getElementById("category");
const statusEl = document.getElementById("status");
const image = document.getElementById("image");
const form = document.getElementById("form");
const msg = document.getElementById("msg");
const grid = document.getElementById("grid");

// LOGIN
window.login = () => {
    if(document.getElementById("pass").value === "2008"){
        document.getElementById("auth").style.display="none";
        document.getElementById("app").style.display="block";
    } else {
        err.classList.remove("hidden");
        setTimeout(()=>err.classList.add("hidden"),2000);
    }
}

// LOAD DATA
onSnapshot(query(collection(db,"brandings"),orderBy("createdAt","desc")), snap=>{
    grid.innerHTML="";
    snap.forEach(d=>{
        const b = d.data();

        grid.innerHTML += `
        <div class="glass p-4 rounded-2xl ${b.status==='Hidden'?'opacity-30':''}">
            <img src="${b.imageUrl}" class="rounded-xl mb-3">
            <h3 class="font-bold">${b.title}</h3>
            <p class="text-xs text-gray-400">${b.category}</p>

            <div class="flex justify-between mt-3 text-xs">
                <button onclick="toggle('${d.id}','${b.status}')">👁️</button>
                <button onclick="del('${d.id}')" class="text-red-500">Delete</button>
            </div>
        </div>`;
    });
});

// TOGGLE
window.toggle = async(id,s)=>{
    await updateDoc(doc(db,"brandings",id),{
        status: s==="Visible"?"Hidden":"Visible"
    });
}

// DELETE
window.del = async(id)=>{
    if(confirm("Delete?")) await deleteDoc(doc(db,"brandings",id));
}

// UPLOAD
form.addEventListener("submit", async(e)=>{
    e.preventDefault();

    try {
        msg.innerText = "Uploading...";

        const file = image.files[0];
        if(!file) throw new Error("No image");

        const compressed = await imageCompression(file,{
            maxSizeMB:1,
            maxWidthOrHeight:1280
        });

        const fd = new FormData();
        fd.append("image",compressed);

        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB}`,{
            method:"POST",
            body:fd
        });

        const data = await res.json();
        console.log("IMGBB:", data);

        if(!data.success){
            throw new Error("Image upload failed");
        }

        await addDoc(collection(db,"brandings"),{
            title: title.value,
            category: category.value,
            imageUrl: data.data.url,
            status: statusEl.value || "Visible",
            createdAt: serverTimestamp()
        });

        msg.innerText = "Done 🔥";
        form.reset();

    } catch(err){
        console.error(err);
        msg.innerText = "Error ❌";
    }
});
</script>

</body>
</html>
