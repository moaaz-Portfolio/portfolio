<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#000;color:#fff;font-family:sans-serif}
.input{background:#111;padding:12px;border-radius:10px;width:100%}
.card{background:#111;padding:15px;border-radius:15px}
</style>
</head>

<body>

<div class="max-w-7xl mx-auto p-6">

<h1 class="text-3xl font-bold mb-8">Dashboard</h1>

<!-- FORM -->
<form id="form" class="space-y-4 mb-10">

<input id="title" class="input" placeholder="Brand Name" required>
<input id="category" class="input" placeholder="Category">
<textarea id="desc" class="input" placeholder="Description"></textarea>

<input type="file" id="images" multiple required>

<div id="captionsBox" class="space-y-2"></div>

<button class="bg-white text-black px-6 py-2 rounded">Upload</button>

</form>

<!-- GRID -->
<div id="grid" class="grid md:grid-cols-2 gap-6"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyDsYNycH16UHTOKcQPXHEsq-glJslhdAJA",
authDomain:"desinger-584a4.firebaseapp.com",
projectId:"desinger-584a4"
});

const db = getFirestore(app);
const IMGBB = "f1f849d83dda1149d7758df485628800";

const form = document.getElementById("form");
const grid = document.getElementById("grid");
const captionsBox = document.getElementById("captionsBox");

// generate captions inputs
images.addEventListener("change", ()=>{
captionsBox.innerHTML="";
[...images.files].forEach((f,i)=>{
captionsBox.innerHTML += `
<input class="input caption" placeholder="Caption for image ${i+1}">
`;
});
});

// LOAD
async function load(){
const snap = await getDocs(collection(db,"brandings"));

grid.innerHTML="";

snap.forEach(d=>{
const b = d.data();

grid.innerHTML += `
<div class="card">

<img src="${b.imageUrl}" class="rounded mb-3">

<h3 class="text-xl font-bold">${b.title}</h3>

<div class="flex flex-wrap gap-2 mt-3 text-sm">

<button onclick="openBrand('${d.id}')">Open</button>
<button onclick="edit('${d.id}','${b.title}','${b.description}')">Edit</button>
<button onclick="toggle('${d.id}','${b.status}')">Toggle</button>
<button onclick="del('${d.id}')">Delete</button>

</div>

</div>
`;
});
}

window.openBrand = (id)=>{
window.open("brand.html?id="+id);
}

// EDIT
window.edit = async(id,title,desc)=>{
const newTitle = prompt("Title:",title);
const newDesc = prompt("Description:",desc);

await updateDoc(doc(db,"brandings",id),{
title:newTitle,
description:newDesc
});

load();
}

// TOGGLE
window.toggle = async(id,status)=>{
await updateDoc(doc(db,"brandings",id),{
status: status==="Visible"?"Hidden":"Visible"
});
load();
}

// DELETE
window.del = async(id)=>{
if(confirm("Delete?")){
await deleteDoc(doc(db,"brandings",id));
load();
}
}

// UPLOAD
form.addEventListener("submit", async(e)=>{
e.preventDefault();

const files = images.files;
let urls = [];

for(let file of files){
const fd = new FormData();
fd.append("image",file);

const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB}`,{
method:"POST",
body:fd
});

const data = await res.json();
urls.push(data.data.url);
}

// captions
const captions = [...document.querySelectorAll(".caption")].map(i=>i.value);

await addDoc(collection(db,"brandings"),{
title: title.value,
category: category.value,
description: desc.value,
imageUrl: urls[0],
images: urls,
captions: captions,
status: "Visible",
createdAt: serverTimestamp()
});

form.reset();
captionsBox.innerHTML="";
load();
});

load();

</script>

</body>
</html>
